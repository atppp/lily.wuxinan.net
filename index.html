<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<script>
(function () {
  var DEST = "https://lilyppbb.wordpress.com";
  // Old post IDs that do not match lilyppbb.wordpress.com post IDs.
  var REMAP = { "6": "2778", "23": "2779", "25": "2780" };
  var PAGES = {
    "255": "/us-travel/",
    "896": "/home-library/",
    "1793": "/library-chinese/",
    "1794": "/library-english/",
    "2074": "/about-me/"
  };
  var params = new URLSearchParams(location.search);
  var p = params.get("p");
  var pageId = params.get("page_id");
  var target = DEST + "/";
  if (pageId && PAGES[pageId]) {
    target = DEST + PAGES[pageId];
  } else if (p && /^\d+$/.test(p)) {
    target = DEST + "/?p=" + (REMAP[p] || p);
  }
  location.replace(target);
})();
</script>
</head>
<body>
<p>Redirecting to <a href="https://lilyppbb.wordpress.com/">https://lilyppbb.wordpress.com/</a>…</p>
</body>
</html>
